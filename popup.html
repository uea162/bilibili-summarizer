<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <h1>B站视频总结</h1>

    <div class="setting-group">
      <label for="provider">AI 服务商</label>
      <select id="provider">
        <option value="claude">Claude (Anthropic)</option>
        <option value="openai">OpenAI</option>
        <option value="deepseek">DeepSeek (推荐，新用户免费)</option>
        <option value="qwen">通义千问 (阿里云，部分免费)</option>
        <option value="glm">智谱 GLM (glm-4-flash 免费)</option>
        <option value="siliconflow">硅基流动 (免费开源模型代理)</option>
        <option value="custom">自定义 (OpenAI 兼容接口)</option>
      </select>
    </div>

    <div class="setting-group">
      <label for="baseUrl">API 地址</label>
      <input type="text" id="baseUrl" placeholder="https://api.deepseek.com">
    </div>

    <div class="setting-group">
      <label for="apiKey">API Key</label>
      <input type="password" id="apiKey" placeholder="sk-...">
      <p class="hint">你的 API Key 仅保存在本地浏览器中</p>
    </div>

    <div class="setting-group">
      <label for="model">模型</label>
      <select id="model"></select>
      <input type="text" id="modelCustom" class="hidden" placeholder="输入模型名称">
    </div>

    <div class="setting-group" id="apiFormatGroup">
      <label for="apiFormat">API 格式</label>
      <select id="apiFormat">
        <option value="openai">OpenAI 兼容 (/v1/chat/completions)</option>
        <option value="claude">Claude/Anthropic (/v1/messages)</option>
      </select>
      <p class="hint">自定义接口请选择对应的 API 格式</p>
    </div>

    <button id="save">保存设置</button>
    <div id="status" class="status hidden"></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
